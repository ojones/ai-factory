name: Factory Change — a fix to the Factory's own code
description: Something inside the Orchestrator went wrong. The Factory plans, codes, reviews and delivers the fix as a pull request.
title: "Factory Change: what the Factory did wrong"
labels: ["factory-change"]
body:
  - type: markdown
    attributes:
      value: |
        Submitting this starts planning at once. Before any Agent runs, the Orchestrator checks that the failure is observable, that the requirements are numbered and checkable, and that a named reproduction test fails on `main`. A ticket that does not meet this is sent back with the reason. This issue is public: never paste a key, token or password.
  - type: textarea
    id: observable_failure
    attributes:
      label: Observable failure
      description: What the Factory did, and what it should have done. Link the run URL and event keys under Evidence.
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: Numbered, each one something a test can check (`1. ...`, `2. ...`).
    validations:
      required: true
  - type: input
    id: reproduction
    attributes:
      label: Reproduction
      description: A unit test that fails on `main`, as `module.Class.test_name` from the `orchestrator/` folder, or `none` and the coder writes it first.
      placeholder: "planning.file_children_test.Filing.test_a_child_is_kept"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Run URL, event keys, log lines.
    validations:
      required: false
