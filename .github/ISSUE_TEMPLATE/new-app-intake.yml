name: New App Intake — new Managed App
description: Propose a new Managed App for the Factory to build.
title: "my-app-name"
labels: ["new-app-intake"]
body:
  - type: markdown
    attributes:
      value: |
        **The issue title is the Managed App's name**, kebab-cased (lowercase letters, digits and hyphens, at most 30 characters). It becomes the repo and Fly app name. Fly app names are unique across all of Fly, so a common name (like `notes-app`) may already be taken; if App Staging reports a collision, rename this issue to something more distinctive.

        Submitting this form starts planning at once. A planner reads your request and splits it into change sets: the first stages the app (repository, deploy, flag service, secrets, all verified), and each later one is built behind its own feature flag, one at a time. If something needs your answer or cannot be built, the planner comments here: edit this issue, remove the **`new-app-intake`** label and add it again to plan again.
  - type: textarea
    id: description
    attributes:
      label: What should be built?
      description: "The Intake Spec: what the app should do, its scope and its constraints."
    validations:
      required: true
  - type: input
    id: cost_cap
    attributes:
      label: Cost cap override (USD)
      description: Optional. Leave blank for the standard per-Build-Run cap. May not exceed the configured ceiling.
      placeholder: "2.00"
    validations:
      required: false
