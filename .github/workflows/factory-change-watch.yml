name: Factory Change watch

# STEP 9.11 and 9.12. A merged Factory Change pull request (branch `factory-change/<child>`) is watched for `factory_change_watch_hours`. If the finding comes back or a model-drift
# alert opens after the merge, the Orchestrator pauses the process and reverts nothing (an open issue labelled `factory-change-paused`); a person clears it.
# If the window passes quietly the child closes, the plan advances and the Build Run child that triggered the finding starts again. Merging with the PAT is what lets the `closed`
# event below start this workflow.
on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: factory-change-watch
  cancel-in-progress: false

jobs:
  merged:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'factory-change/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Start watching the merged change
        env:
          FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: PYTHONPATH=orchestrator python -m factory_change.watch_merged merged

  sweep:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Settle the changes whose window has passed, pause on a failure
        env:
          FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
        run: PYTHONPATH=orchestrator python -m factory_change.watch_merged sweep
