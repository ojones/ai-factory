name: Production feedback

# Every six hours (and on demand): read each Managed App's recent production logs and the owner's `escaped-defect` issues, and
# turn what repeats into an Update Intake that starts itself. Fly keeps only a short log buffer, so a daily scan would miss most
# of it. orchestrator/production_feedback.py does the work; `limits.production_feedback` in agents/profiles.yml is the switch.
on:
  schedule:
    - cron: "11 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-feedback
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Scan production feedback
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
          FACTORY_GH_TOKEN: ${{ github.token }}
        run: python orchestrator/production_feedback.py
