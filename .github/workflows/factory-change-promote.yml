name: Factory Change promote

# STEP 9.1. A `factory-fix-request` whose cause the Retrospective named `orchestrator_gap` is handed to the Factory Change process once it has been seen
# `promote_after_runs` times (the first report plus its "Failed again" comments): the Orchestrator files a Factory Change Intake from the request's numbered
# requirements, which plan.yml then plans. Other causes stay on the human `ready-for-factory-run` path. Filing uses the PAT so the new issue starts a workflow.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: factory-change-promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Hand orchestrator_gap requests to the Factory Change process
        env:
          FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
        run: PYTHONPATH=orchestrator python -m factory_change.promote
