name: Build Run

# The multi-agent Build Run (issue #32), dispatched by App Staging with the
# Intake issue number and app name. All logic is in orchestrator/build_run.py;
# the stages and rules it implements are in ARCHITECTURE.md → Agents and Build
# Run stages. Role prompts, models and limits come from agents/.
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Intake issue number in ai-factory"
        required: true
      app_name:
        description: "Managed App name (its repo name)"
        required: true

permissions:
  contents: read
  issues: write
  actions: read

# Same Managed App: serialized, and every queued run is kept. Without `queue: max` a group holds
# one running and one pending run and a newer pending run cancels the older one (shown by a probe
# on 2026-10-12: of three dispatches, the middle one was cancelled). Update Intake can queue several.
concurrency:
  group: build-run-${{ inputs.app_name }}
  cancel-in-progress: false
  queue: max

env:
  APP_NAME: ${{ inputs.app_name }}
  ISSUE_NUMBER: ${{ inputs.issue_number }}

jobs:
  build-run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          path: factory
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Install OpenHands and the orchestrator's dependencies
        run: pip install "openhands==$(cat factory/agents/openhands-version.txt)" pyyaml

      # limits.agent_isolation in agents/profiles.yml. With `user`, Agents run as a separate unprivileged account, and the Build Run's
      # directories move to /srv/agent (the runner's home is closed to other accounts), shared through ACLs.
      - name: Working directories, and the Agent user if isolation is on
        run: |
          mode=$(python -c "import yaml; print(yaml.safe_load(open('factory/agents/profiles.yml'))['limits'].get('agent_isolation', 'off'))")
          if [ "$mode" = user ]; then
            sudo apt-get install -y -qq acl > /dev/null
            sudo useradd -m -s /bin/bash agent
            sudo mkdir -p /srv/agent
            sudo chown agent:agent /srv/agent
            sudo setfacl -R -m "u:$USER:rwx" /srv/agent
            sudo setfacl -R -d -m "u:$USER:rwx" -m u:agent:rwx /srv/agent
            git config --global --add safe.directory '*'
            echo "AGENT_USER=agent" >> "$GITHUB_ENV"
            echo "BUILD_RUN_DIR=/srv/agent/run" >> "$GITHUB_ENV"
            echo "APP_DIR=/srv/agent/app" >> "$GITHUB_ENV"
          else
            echo "BUILD_RUN_DIR=$GITHUB_WORKSPACE/run" >> "$GITHUB_ENV"
            echo "APP_DIR=$GITHUB_WORKSPACE/app" >> "$GITHUB_ENV"
          fi

      - name: Unit-test the orchestrator's deterministic logic
        run: python -m unittest discover factory/orchestrator

      - name: Run the Build Run
        env:
          FACTORY_GH_TOKEN: ${{ github.token }}
          FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          GROWTHBOOK_ADMIN_PAT: ${{ secrets.GROWTHBOOK_ADMIN_PAT }}
          PREVIEW_MASTER_SECRET: ${{ secrets.PREVIEW_MASTER_SECRET }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: python factory/orchestrator/build_run.py run

      # Always last: Summary, Report, and the failure Issue, even after a
      # breach, a crash or a cancel.
      - name: Write Summary and Report; open failure Issue
        if: always()
        env:
          FACTORY_GH_TOKEN: ${{ github.token }}
          FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
        run: python factory/orchestrator/build_run.py finalize

      - name: Post-mortem for a run that did not end clean
        if: always()
        env:
          FACTORY_GH_TOKEN: ${{ github.token }}
          FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
        run: python factory/orchestrator/postmortem.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-run
          path: |
            ${{ env.BUILD_RUN_DIR }}/artifacts/
            ${{ env.BUILD_RUN_DIR }}/state.json
            ${{ env.BUILD_RUN_DIR }}/verdict-*.json
            ${{ env.BUILD_RUN_DIR }}/test-report-*.json
            ${{ env.BUILD_RUN_DIR }}/api-check-*.jsonl
            ${{ env.BUILD_RUN_DIR }}/diagnosis-*.json
            ${{ env.BUILD_RUN_DIR }}/findings-*.json
          if-no-files-found: ignore
