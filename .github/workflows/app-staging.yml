name: App Staging

# Stages a new Managed App (ARCHITECTURE.md → Intake, Deployment provisioning; STEP 3.1): `proceed-with-change` on a planned `kind: staging` child, which is the
# first child of a planned New App Intake. The work is in infra/app-staging/stage.sh.
on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  stage:
    # Job-level (not workflow-level) so that label events this job skips never
    # enter the group and cancel a real run waiting behind another. One Managed
    # App through staging at a time.
    concurrency:
      group: app-staging
      cancel-in-progress: false
    if: >-
      github.event.label.name == 'proceed-with-change' &&
      contains(github.event.issue.labels.*.name, 'update-app-intake') &&
      contains(github.event.issue.body, '"kind":"staging"')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      - name: Stage the Managed App
        env:
          # GITHUB_TOKEN handles issue comments/labels/close in ai-factory; the
          # PAT does everything that touches the new repo, plus the dispatch.
          GH_TOKEN: ${{ github.token }}
          FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GROWTHBOOK_ADMIN_PAT: ${{ secrets.GROWTHBOOK_ADMIN_PAT }}
          PREVIEW_MASTER_SECRET: ${{ secrets.PREVIEW_MASTER_SECRET }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          FACTORY_GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          FACTORY_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: infra/app-staging/stage.sh
