name: Template sync

# Once a night (07:47 UTC), and by hand, file an Update Intake for each Managed App that was seeded before the latest Starter Template
# change, and start it. A merge to main does not start it: a Starter change waits for the night pass, so no Build Run starts because of
# a push. orchestrator/template_sync.py does the work; nothing here changes an app directly.
on:
  schedule:
    - cron: "47 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: template-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: File template-sync Intakes
        env:
          FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
          FACTORY_GH_TOKEN: ${{ github.token }}
        run: python orchestrator/template_sync.py
