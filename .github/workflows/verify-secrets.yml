name: Verify secrets

# Manual check that each ai-factory secret is present and actually works.
# GitHub secrets are write-only, so using them is the only way to confirm a
# stored value is right. Prints only pass/fail per secret, never a value.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GROWTHBOOK_API_HOST: https://ai-factory-growthbook.fly.dev:3100

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check each secret
        env:
          FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GROWTHBOOK_ADMIN_PAT: ${{ secrets.GROWTHBOOK_ADMIN_PAT }}
          PREVIEW_MASTER_SECRET: ${{ secrets.PREVIEW_MASTER_SECRET }}
        run: |
          set +x
          failed=0
          report() { # name, ok(0/1), detail
            if [ "$2" = 0 ]; then echo "PASS  $1 $3"; else echo "FAIL  $1 $3"; failed=1; fi
          }
          status() { curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$@"; }

          if [ -z "$FACTORY_PAT" ]; then report FACTORY_PAT 1 "(not set)"; else
            login=$(curl -s --max-time 30 -H "Authorization: Bearer $FACTORY_PAT" https://api.github.com/user | jq -r '.login // empty')
            [ "$login" = "ojones" ] && report FACTORY_PAT 0 "(authenticates as $login)" || report FACTORY_PAT 1 "(resolved login: '${login:-none}', expected ojones)"
          fi

          if [ -z "$DEEPINFRA_API_KEY" ]; then report DEEPINFRA_API_KEY 1 "(not set)"; else
            code=$(status -X POST https://api.deepinfra.com/v1/openai/chat/completions \
              -H "Authorization: Bearer $DEEPINFRA_API_KEY" -H "Content-Type: application/json" \
              -d '{"model":"Qwen/Qwen3-Coder-480B-A35B-Instruct-Turbo","max_tokens":1,"messages":[{"role":"user","content":"hi"}]}')
            [ "$code" = 200 ] && report DEEPINFRA_API_KEY 0 "(1-token call returned 200)" || report DEEPINFRA_API_KEY 1 "(HTTP $code)"
          fi

          if [ -z "$FLY_API_TOKEN" ]; then report FLY_API_TOKEN 1 "(not set)"; else
            code=$(status -H "Authorization: Bearer $FLY_API_TOKEN" "https://api.machines.dev/v1/apps?org_slug=personal")
            [ "$code" = 200 ] && report FLY_API_TOKEN 0 "(listed apps in org 'personal')" || report FLY_API_TOKEN 1 "(HTTP $code)"
          fi

          if [ -z "$GROWTHBOOK_ADMIN_PAT" ]; then report GROWTHBOOK_ADMIN_PAT 1 "(not set)"; else
            code=$(status -H "Authorization: Bearer $GROWTHBOOK_ADMIN_PAT" "$GROWTHBOOK_API_HOST/api/v1/features?limit=1")
            [ "$code" = 200 ] && report GROWTHBOOK_ADMIN_PAT 0 "(admin API returned 200)" || report GROWTHBOOK_ADMIN_PAT 1 "(HTTP $code from $GROWTHBOOK_API_HOST)"
          fi

          if [ "${#PREVIEW_MASTER_SECRET}" -ge 32 ]; then report PREVIEW_MASTER_SECRET 0 "(length ${#PREVIEW_MASTER_SECRET})"; else report PREVIEW_MASTER_SECRET 1 "(missing or shorter than 32 characters)"; fi

          exit $failed
