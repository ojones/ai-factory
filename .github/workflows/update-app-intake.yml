name: Update App Intake

# Adding the `proceed-with-change` label to an `update-app-intake` issue starts it at once: this workflow checks the
# issue and dispatches a Build Run, which plans the change, then codes, tests and reviews it
# (orchestrator/build_run/start_build.py; ARCHITECTURE.md: Intake). A change set that waits on an earlier one of the same
# plan is given the label by the Orchestrator when its dependencies finish; that is done with the PAT, because a
# label added with the Actions token would not start this workflow.
on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  start:
    # Job-level so label events this job skips never queue behind a real one.
    if: >-
      github.event.label.name == 'proceed-with-change' &&
      contains(github.event.issue.labels.*.name, 'update-app-intake')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the issue and dispatch the Build Run
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
          FACTORY_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: PYTHONPATH=orchestrator python -m build_run.start_build start
