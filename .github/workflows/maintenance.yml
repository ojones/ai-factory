name: Maintenance

# Once a day (and on demand): turn each Managed App's open Dependabot pull requests (npm packages, Docker base image) into one
# Update App Intake that starts itself. Dependabot only detects; the change goes through the normal Build Run and gate.
# orchestrator/maintenance/dependency_updates.py does the work; `limits.maintenance.enabled` in agents/profiles.yml is the switch.
on:
  schedule:
    - cron: "7 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: File maintenance Intakes
        env:
          FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
          FACTORY_GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=orchestrator python -m maintenance.dependency_updates
