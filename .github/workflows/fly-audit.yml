name: Fly audit

# Once a day (and on demand): list the Fly apps in the organization and open one `fly-orphans` issue for any that is neither
# Factory infrastructure nor a Managed App the Factory created, since those bill for machines nothing will stop. Deletes nothing.
# orchestrator/monitoring/fly_audit.py does the work. FLY_ORG is the Fly organization slug (a repository variable; default `personal`).
on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: fly-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Report Fly apps nobody owns
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ vars.FLY_ORG }}
          FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
          FACTORY_GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=orchestrator python -m monitoring.fly_audit
