# Per-role Agent configuration. See README.md. Model ids are DeepInfra ids.

provider:
  base_url: https://api.deepinfra.com/v1/openai

roles:
  coder:
    # DeepSeek-V4.1-Flash over the 480B Qwen: on the replay of two real recorded tasks it was clean 6/6
    # (the Qwen 0/6, each with real bugs) at 165 s vs 202 s and $0.03 vs $0.19 a run; smoke screen and
    # replay results are in .wayfinder/coder-speed/tickets/14-*.md and 15-*.md. It missed one smoke task
    # (distinct todo ids) 3/3, so if real runs show it stuck in fix rounds, try `fix_model` below.
    model: deepseek-ai/DeepSeek-V4.1-Flash
    # Used for a run when the provider no longer serves `model` (checked with a one-token request before any work; the nightly canary reports it first).
    # Every role may name one; keep it a different, currently served model that was measured for the role. The benchmark (docs/benchmark-protocol.md) is how to
    # choose and re-check it.
    fallback_model: Qwen/Qwen3-Coder-480B-A35B-Instruct-Turbo
    # Optional: a stronger model for every coder attempt after round 1 (fix rounds, pipeline fixes),
    # so round 1 can use a faster one. Unset, every attempt uses `model`.
    # fix_model: Qwen/Qwen3-Coder-480B-A35B-Instruct-Turbo
    prompt: prompts/coder.md
  tester:
    # Nemotron-3-Ultra over the 480B Qwen: on the four edge-case bugs the Qwen mostly misses (blank text, id 0, '1abc',
    # duplicate ids) the seeded-bug benchmark (agents/smoke-tester, ticket 07) caught 11 of 12 against 3 of 9, with no false
    # alarms on the correct app, at $0.147 a run against about $0.11. A different lab from the coder and reviewer (DeepSeek),
    # which keeps the tester independent of them. Not yet measured on the easy bugs (wrong status, flag leak) or the held-out
    # ones; if a run shows it missing those, switch back by restoring Qwen/Qwen3-Coder-480B-A35B-Instruct-Turbo here.
    model: nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B
    fallback_model: Qwen/Qwen3-Coder-480B-A35B-Instruct-Turbo
    prompt: prompts/tester.md
  reviewer:
    # Intended to be a different lab than the coder so they don't share blind spots, but the coder is
    # now DeepSeek-V4.1-Flash too, so today they share a model (known deviation; see ARCHITECTURE.md).
    # Pro (deepseek-ai/DeepSeek-V4-Pro-0813, the #25 pick) spent 7-20 minutes per review in real
    # Build Runs, reasoning at ~40 tokens/s. Flash scored 50/50 on the smoke fixtures against
    # Pro's 48/50, at ~10s a review, so it is the reviewer (issue #41). Switch back by editing here.
    model: deepseek-ai/DeepSeek-V4.1-Flash
    fallback_model: Qwen/Qwen3-Coder-480B-A35B-Instruct-Turbo
    # single_call: one model call over a prompt the Orchestrator assembles (diff, changed files,
    # INTAKE.md, flag usage), fast_prompt. It falls back to the exploring Agent (prompt) when the change is too big for one prompt or the call fails.
    mode: single_call
    fast_prompt: prompts/reviewer-fast.md
    prompt: prompts/reviewer.md
  pipeline:
    model: Qwen/Qwen3-Coder-480B-A35B-Instruct-Turbo
    fallback_model: deepseek-ai/DeepSeek-V4.1-Flash
    prompt: prompts/pipeline.md
  # Turns a larger Intake into ordered change sets with acceptance criteria (orchestrator/planning/validate_plan.py checks the
  # plan). Runs first in a Build Run for an Update App Intake. The model is unmeasured: gpt-oss-120b replaced Qwen3-Coder-480B on 2026-10-15
  # because the 480B hung for minutes at a time on real runs (one planner attempt took 1277 s) and a planner needs no code-tuned model;
  # gpt-oss-120b is about 8x cheaper and a different lab from the coder and reviewer (DeepSeek) and the tester (Nvidia). Watch the planner
  # time, cost and plan_gap lessons on the next runs; ticket 30 would measure it properly.
  planner:
    model: openai/gpt-oss-120b
    fallback_model: Qwen/Qwen3.8-Flash
    prompt: prompts/planner.md
  # After every Build Run, released or not: reads what the run found and how it ended, files the improvements and proposes a fix as a PR (orchestrator/retrospective.py).
  retrospective:
    model: Qwen/Qwen3-Coder-480B-A35B-Instruct-Turbo
    fallback_model: deepseek-ai/DeepSeek-V4.1-Flash
    prompt: prompts/retrospective.md

limits:
  # Rounds of review and fixing in all. A blocked review costs one model call and a coder round and never pushes.
  review_rounds: 4
  # The Orchestrator runs the app's `npm run check` (type-check and lint) on each coder commit before the reviewer sees it; a failure goes
  # back to the coder as a rejected commit (three attempts, like a protected-file violation), not as a review round. False turns it off.
  precheck: true
  # Deployed tests that may fail before the run stops for a person (0 turns it off). A failed deployed test costs a push, CI, a deploy
  # and a tester pass, and the runs that needed a third round cost about four times the one-round runs, so only one fix gets a second test.
  test_rounds: 2
  # When the tester's checks were only blocked or not run (none failed), the coder cannot fix that: the tester looks again at the same
  # deployed commit this many times, and a run that still cannot verify stops for a person instead of spending coder rounds.
  test_retries: 1
  # Per-Build-Run LLM spend. The default applies when an Intake gives no
  # override; an Intake override may not exceed the ceiling. Starting values
  # to revise after the first real multi-agent run (issue #34).
  cost_cap_usd_default: 2.00
  cost_cap_usd_ceiling: 10.00
  # Lifetime of the run's scoped JWT; the Actions job limit is 6 hours.
  jwt_ttl_seconds: 21600
  # Wall-clock budget for the whole Build Run; the Actions job limit is 6 hours.
  time_limit_minutes: 330
  # The retrospective Agent after a run; one run, outside the Build Run's cost cap.
  retrospective_timeout_minutes: 15
  # The retrospective Agent gets its own single-model credential limited to this much per analysis (it never
  # holds the parent key), and no more than this many learning PRs may be open at once.
  retrospective_cost_cap_usd: 0.50
  max_open_learning_prs: 3
  # A lesson, minor finding or factory improvement is recorded and counted (distinct runs, a hidden marker in its issue) on its first sighting, but the
  # Agent analyses it and proposes a fix PR only once this many distinct runs have seen it. Severe lessons (an audit violation, a watchdog switch-off), stuck
  # runs and a lesson that came back after its fix go at once. 1 acts on the first sighting.
  promote_after_runs: 2
  # Per Agent invocation; a hung Agent is killed and counts as a failed attempt.
  agent_timeout_minutes: 45
  # An Agent whose event stream has not grown for this long is killed and counts as a failed attempt (0 turns it off). A real run
  # sat the full 45 minutes twice with no output. The stream grows at every step, so a few quiet minutes means it is stuck.
  agent_stall_minutes: 8
  # off: Agents run as the same account as the Orchestrator. user: the workflow creates an unprivileged account, the work
  # directories live in /srv/agent, and every Agent runs as it through sudo, so it cannot read the Orchestrator's environment or
  # files (where the PAT, Fly token and GrowthBook admin key are). The Orchestrator proves this with a self-check at the start of
  # each run and stops if it does not hold.
  agent_isolation: user
  # The tester may drive a headless browser (orchestrator/build_run/ui_check.py) when a change touches the frontend or the spec mentions a screen.
  # The workflow installs the pinned Playwright and Chromium (agents/playwright-version.txt) only when this is true.
  ui_check: true
  # Waiting for Test Gate -> Build -> Deploy of one pushed commit.
  pipeline_timeout_minutes: 25
  # Re-runs of a failed pipeline step the Pipeline Agent diagnoses as flaky/infra.
  pipeline_retries: 2
  # Coder fixes triggered by Pipeline Agent diagnoses (separate from review_rounds).
  pipeline_fix_attempts: 5
  # Refuse to start a Build Run once the Build Runs that finished today (UTC) have spent this much in total,
  # read from the spend-ledger issue in ai-factory. 0 disables it. Runs in flight count when they finish.
  daily_cost_cap_usd: 10.00
  # Fly apps that are Factory infrastructure rather than Managed Apps (besides ai-factory-growthbook); the daily Fly audit
  # (orchestrator/monitoring/fly_audit.py) reports every other Fly app that has no Managed App repo as an orphan.
  fly_infra_apps: []
  # Errors a deployed app logs, and `escaped-defect` issues its owner files, become Update App Intakes that start themselves
  # (orchestrator/production_feedback.py, scheduled by production-feedback.yml). min_occurrences: times one error must appear in a scan.
  # Daily: Dependabot's open pull requests for each app (npm packages, Docker base image) become one self-starting Update App Intake
  # (orchestrator/maintenance/dependency_updates.py, maintenance.yml). Dependabot only detects; nothing merges its pull requests.
  maintenance:
    enabled: true
  # A proven flag is retired inside the next Update App Intake's Build Run for the same app, never in a run of its own: once a later Build Run
  # has also released something and the flag is at least min_age_days old, up to piggyback_max (5) flags ride along, so a backlog clears quickly (orchestrator/flag_retirement.py).
  flag_retirement:
    min_age_days: 1
    piggyback_max: 5
  production_feedback:
    enabled: true
    min_occurrences: 3
    max_per_app_per_day: 2
  # Build Runs allowed in flight across all Managed Apps (v1 stages one at a time).
  max_simultaneous_build_runs: 1
  # A goal, not a limit: peak context (tokens in one LLM call) per Agent invocation to
  # stay under, so Agents work in the model's reliable range. Over-goal stages are flagged.
  context_goal_tokens: 100000
  # An Update App Intake is planned first (agents/prompts/planner.md); more change sets than this is refused as too big
  # for one Intake. Set planner_enabled false to run an Update App Intake's request straight through as one change.
  planner_enabled: true
  planner_max_change_sets: 8
  # More acceptance criteria than this in one change set means it is not one slice to release and revert together; the plan is rejected.
  planner_max_criteria: 6
  # Nothing is ever reverted in git: code is fixed forward and `main` keeps every commit. The one exception is a regression (the tester
  # finds behaviour that was live before the run stops working): the app's own CI then redeploys the previous version (the starting
  # commit's image) with `rollback-fly.yml`. A change that only breaks itself stays dark, because its flag is never released, and is
  # fixed by a later run.
  rollback_regressions: true
  rollback_timeout_minutes: 15
  # File a fix request issue for every run that ends badly: what happened, what was done, and numbered requirements, routed
  # to the Factory (a prompt, planner, template or orchestrator cause) or to the app (an Update App Intake for you to start).
  fix_requests: true
  # A fix request routed to the app (the request was ambiguous or too big) is an Update App Intake that starts itself: no person
  # reviews it. A chain stops after this many automatic retries of one Intake and waits for a person.
  fix_request_autostart: true
  fix_request_max_attempts: 2
  # Stop early when this many rounds in a row leave exactly the same checks failing and the same
  # findings open (the fix attempts are changing nothing the checks can see). 0 disables it.
  stuck_rounds: 3
  # After a release the Orchestrator watches the app this long and switches the flags it released
  # off by itself on a run of failed health checks or a rise in error-level log lines. 0 disables it.
  watchdog_minutes: 10
  watchdog_interval_seconds: 30
  watchdog_max_failures: 3
  watchdog_max_errors: 5
  # Largest single-call review prompt, in characters (about 4 per token); bigger changes use the exploring reviewer.
  review_context_max_chars: 200000
