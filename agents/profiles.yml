# Per-role Agent configuration. See README.md. Model ids are DeepInfra ids.

provider:
  base_url: https://api.deepinfra.com/v1/openai

roles:
  coder:
    model: Qwen/Qwen3-Coder-480B-A35B-Instruct-Turbo
    prompt: prompts/coder.md
  tester:
    model: Qwen/Qwen3-Coder-480B-A35B-Instruct-Turbo
    prompt: prompts/tester.md
  reviewer:
    # Deliberately a different lab than the coder, so they don't share blind spots.
    # Smoke-tested in issue #33 (agents/smoke/); runner-up deepseek-ai/DeepSeek-V4.1-Flash.
    model: deepseek-ai/DeepSeek-V4-Pro-0813
    prompt: prompts/reviewer.md
  pipeline:
    model: Qwen/Qwen3-Coder-480B-A35B-Instruct-Turbo
    prompt: prompts/pipeline.md

limits:
  review_rounds: 10
  # Per-Build-Run LLM spend. The default applies when an Intake gives no
  # override; an Intake override may not exceed the ceiling. Starting values
  # to revise after the first real multi-agent run (issue #34).
  cost_cap_usd_default: 2.00
  cost_cap_usd_ceiling: 10.00
  # Lifetime of the run's scoped JWT; the Actions job limit is 6 hours.
  jwt_ttl_seconds: 21600
