name: Build

# Runs in parallel with Test Gate on every push to main; Deploy waits for both to be green.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Reuse unchanged layers (notably the npm ci layer) from earlier builds.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SHA tag only: `latest` moves in Deploy, once Test Gate has also passed.
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
