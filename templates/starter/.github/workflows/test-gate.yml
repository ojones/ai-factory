name: Test Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      # The image build (Build workflow) does the real compile and bundle; here a type-check is enough.
      - name: Type-check
        run: npm run check

      - name: Test (unit tests + boot/health-check smoke test)
        run: npm test
