# The Fly app name is deliberately absent: it is the repo name, passed as
# `--app` by deploy-fly.yml and fly/provision.sh, so this file stays
# byte-identical across Managed Apps.
primary_region = "iad"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
